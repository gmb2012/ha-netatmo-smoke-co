[project]
name = "netatmo-melder-ha"
version = "0.1.0"
description = "Unofficial Home Assistant integration for Netatmo smoke (NSD) and CO (NCO) alarms via the Netatmo cloud API"
requires-python = ">=3.13"
license = "MIT"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
